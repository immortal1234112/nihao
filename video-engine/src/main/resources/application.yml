spring:
  application:
    name: video-engine
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/agent_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

server:
  port: 8086

platform:
  require-api-key: ${REQUIRE_API_KEY:true}

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true

platform:
  video:
    # 视频本地下载目录（可通过环境变量 VIDEO_DOWNLOAD_DIR 覆盖）
    download-dir: ${VIDEO_DOWNLOAD_DIR:C:\\Users\\immortal\\Videos\\Ai视频}
    # 是否启用本地下载（默认 true，可通过环境变量 VIDEO_DOWNLOAD_ENABLED 覆盖）
    download-enabled: ${VIDEO_DOWNLOAD_ENABLED:true}

logging:
  level:
    com.platform.video: DEBUG
