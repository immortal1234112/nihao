spring:
  application:
    name: user-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/user_service?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

server:
  port: 8081

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # 必须通过环境变量 JWT_SECRET 配置 ≥32 字符强密钥（缺失或弱密钥时 JwtUtils 拒绝启动）
  secret: ${JWT_SECRET:}
  access-token-ttl: 7200
  refresh-token-ttl: 604800

internal:
  # 服务间内部接口鉴权令牌：/api/v1/internal/** 校验 X-Internal-Token（start.ps1 自动生成）
  # 未配置时不启用校验（本地模式），生产环境必须通过 INTERNAL_AUTH_TOKEN 配置
  auth-token: ${INTERNAL_AUTH_TOKEN:}

logging:
  level:
    com.platform.user: DEBUG
    com.platform.user.mapper: DEBUG
