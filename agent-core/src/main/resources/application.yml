spring:
  application:
    name: agent-core
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/agent_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5

server:
  port: 8082

internal:
  # 服务间内部接口鉴权令牌：调用 /api/v1/internal/** 时附加 X-Internal-Token（start.ps1 自动生成）
  auth-token: ${INTERNAL_AUTH_TOKEN:}

model-config:
  # model_config API key 加密密钥（AES-256，需 32 字符；start.ps1 自动生成并持久化到 .crypto-key）
  # 未配置时保持明文模式（存量部署兼容）
  crypto-key: ${MODEL_CONFIG_CRYPTO_KEY:}

platform:
  require-api-key: ${REQUIRE_API_KEY:true}
  # 审核/配额服务异常时的降级开关：默认失败关闭（false）；本地开发可用环境变量显式开启降级
  audit:
    degrade-allowed: ${PROMPT_AUDIT_DEGRADE_ALLOWED:false}
  quota:
    degrade-allowed: ${QUOTA_DEGRADE_ALLOWED:false}
  # 中文提示词自动翻译/润色为英文（生成模型对英文理解更佳；失败降级原文不阻塞任务）
  prompt-enhance:
    enabled: ${PROMPT_ENHANCE_ENABLED:true}
    provider: ${PROMPT_ENHANCE_PROVIDER:deepseek}
    max-tokens: ${PROMPT_ENHANCE_MAX_TOKENS:1024}
  # 卡死任务恢复扫描（StuckTaskRecoveryJob）：
  # PROCESSING 超时（分钟，默认 120 = 视频引擎幂等锁 TTL 7200s）→ 置 FAILED；PENDING 超时（分钟，默认 30）→ 重新分发
  recovery:
    interval-ms: ${RECOVERY_INTERVAL_MS:300000}
    processing-timeout-minutes: ${RECOVERY_PROCESSING_TIMEOUT_MIN:120}
    pending-timeout-minutes: ${RECOVERY_PENDING_TIMEOUT_MIN:30}

rag:
  chunk-size: 500
  chunk-overlap: 50
  embedding-batch-size: 32
  embedding-max-retries: 2
  search-max-candidates: 2000
  search-topk-limit: 10
  upload-max-size-bytes: 2097152

# 多轮对话 + 长期记忆（Nacos 同名配置可覆盖）
chat:
  max-history-tokens: 4096   # 历史截断预算（小窗口模型需下调）
  token-ratio: 0.9           # 字符→token 粗估
  stream:
    # SseEmitter 超时（显式指定，不能依赖默认：Spring MVC 无配置时继承 Tomcat 30s 异步超时）
    timeout-ms: 300000
    # 心跳注释帧间隔：必须小于任何中间代理的 idle 超时（nginx proxy_read_timeout 默认 60s）
    heartbeat-ms: 15000
    # 单次生成的墙钟上限：防跑飞的模型长期占住 chat-stream 线程
    max-duration-ms: 180000

# 联网搜索（Web Search）已整体下线（2026-09-17）：
#   原自建 SearXNG 常驻 1GB（uwsgi 多 worker）性价比极低，且 cn.bing.com 后端对
#   中文长句只匹配开头几个字，检索质量不可用。search 模块（provider 目录、
#   adapter、SearchController）与 model_config 种子数据已一并删除。
memory:
  enabled: true
  extract-provider: ''       # 空=复用会话 provider
  extract-max-tokens: 1024
  top-k: 3
  embedding-provider: siliconflow-embedding
  search:
    max-candidates: 500
  dedupe-similarity: 0.88     # 相似记忆去重阈值（BGE-M3 近义短句通常 0.85~0.93）
  max-count-per-user: 200     # 每用户每板块记忆数量上限，超出不再新增
  long-term-max-count: 30     # 长期记忆无条件注入上限（条）
  long-term-max-chars: 2000   # 长期记忆注入字符上限（防 prompt 膨胀）

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.platform.agent: DEBUG
