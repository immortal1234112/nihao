spring:
  application:
    name: gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # 仅放行受信任的前端来源（多来源逗号分隔，如 http://localhost:3000,https://admin.example.com）
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 3600
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      routes:
        - id: auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
        - id: users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: tenants
          uri: lb://user-service
          predicates:
            - Path=/api/v1/tenants/**
        - id: tasks
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/tasks/**
        - id: admin
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/admin/**
        - id: open-api
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/open/**
        - id: llm
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/llm/**
        - id: rag
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/rag/**
        - id: files
          uri: lb://storage-service
          predicates:
            - Path=/api/v1/files/**
        - id: meme
          uri: lb://image-engine
          predicates:
            - Path=/api/v1/meme/**
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        shared-configs:
          - data-id: gateway-routes.yaml
            group: DEFAULT_GROUP
            refresh: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

server:
  port: 8080

jwt:
  # 必须通过环境变量 JWT_SECRET 配置 ≥32 字符强密钥（缺失或弱密钥时 JwtUtils 拒绝启动）
  secret: ${JWT_SECRET:}
  access-token-ttl: 7200
  refresh-token-ttl: 604800

internal:
  # 服务间内部接口鉴权令牌（start.ps1 自动生成到 .internal-token 并注入 INTERNAL_AUTH_TOKEN）
  # 网关作为调用方在调 user-service 内部接口时携带该令牌；未配置则不附加
  auth-token: ${INTERNAL_AUTH_TOKEN:}

gateway:
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:100}
    window-seconds: ${RATE_LIMIT_WINDOW:60}
    path-patterns: /api/**

logging:
  level:
    com.platform.gateway: DEBUG