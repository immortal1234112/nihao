spring:
  application:
    name: gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # 仅放行受信任的前端来源（多来源逗号分隔，如 http://localhost:3000,https://admin.example.com）
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 3600
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      routes:
        - id: auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
        - id: users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: tenants
          uri: lb://user-service
          predicates:
            - Path=/api/v1/tenants/**
        # WebSocket 升级路由必须排在 tasks 之前（lb:ws:// 用 WS 协议转发，不受 30s response-timeout 影响）
        # RewritePath：agent-core 注册的端点是 /ws/task-progress，网关路径 /api/v1/tasks/ws 必须重写后转发，否则返回 200 而非 101 升级
        # $\{suffix} 转义引用命名组：不转义会被 Spring 占位符解析吞掉/启动失败（Spring Cloud Gateway 官方推荐写法）
        - id: task-ws
          uri: lb:ws://agent-core
          predicates:
            - Path=/api/v1/tasks/ws/**
          filters:
            - RewritePath=/api/v1/tasks/ws(?<suffix>.*), /ws/task-progress$\{suffix}
        - id: tasks
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/tasks/**
        # Phase1 项目/资产域：项目、资产中心、模型能力目录（agent-core）
        - id: projects
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/projects/**
        - id: assets
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/assets/**
        - id: model-capabilities
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/model-capabilities/**
        - id: templates
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/templates/**
        - id: admin
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/admin/**
        - id: open-api
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/open/**
        # SSE 流式对话：必须排在 llm 之前（路由按定义顺序匹配，Path=/api/v1/llm/** 会先命中它）。
        # metadata.response-timeout=-1 → NettyRoutingFilter 视为无超时不套 Flux.timeout，
        # 否则全局 httpclient.response-timeout: 30s 是**整条响应**的总时长上限（不是 idle），
        # 长回答会在第 30 秒被掐断并转成 504。
        # 超时兜底改由后端承担：SseEmitter 300s + 15s 心跳注释帧（见 chat.stream.* 配置）。
        - id: llm-stream
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/llm/chat/stream
          metadata:
            response-timeout: -1
        - id: llm
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/llm/**
        - id: rag
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/rag/**
        # 联网搜索：对话页「联网搜索」开关靠 /search/status 判断可用性，
        # 缺这条路由会 404 → 前端把搜索判为不可用 → 按钮永久置灰。
        - id: search
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/search/**
        - id: audit
          uri: lb://security-service
          predicates:
            - Path=/api/v1/audit/**
        - id: files
          uri: lb://storage-service
          predicates:
            - Path=/api/v1/files/**
        - id: public-files
          uri: lb://storage-service
          predicates:
            - Path=/api/v1/public/files/**
        - id: meme
          uri: lb://image-engine
          predicates:
            - Path=/api/v1/meme/**
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        shared-configs:
          - data-id: gateway-routes.yaml
            group: DEFAULT_GROUP
            refresh: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

server:
  port: 8080

jwt:
  # 必须通过环境变量 JWT_SECRET 配置 ≥32 字符强密钥（缺失或弱密钥时 JwtUtils 拒绝启动）
  secret: ${JWT_SECRET:}
  access-token-ttl: 7200
  refresh-token-ttl: 604800

internal:
  # 服务间内部接口鉴权令牌（start.ps1 自动生成到 .internal-token 并注入 INTERNAL_AUTH_TOKEN）
  # 网关作为调用方在调 user-service 内部接口时携带该令牌；未配置则不附加
  auth-token: ${INTERNAL_AUTH_TOKEN:}

gateway:
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:100}
    window-seconds: ${RATE_LIMIT_WINDOW:60}
    path-patterns: /api/**

logging:
  level:
    # 保持 INFO：DEBUG 会把含 query token 的完整 URI（WS 升级路径）写入日志
    com.platform.gateway: INFO