spring:
  application:
    name: gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 3600
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      routes:
        - id: auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
        - id: users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: tenants
          uri: lb://user-service
          predicates:
            - Path=/api/v1/tenants/**
        - id: tasks
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/tasks/**
        - id: admin
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/admin/**
        - id: open-api
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/open/**
        - id: llm
          uri: lb://agent-core
          predicates:
            - Path=/api/v1/llm/**
        - id: files
          uri: lb://storage-service
          predicates:
            - Path=/api/v1/files/**
        - id: meme
          uri: lb://image-engine
          predicates:
            - Path=/api/v1/meme/**
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        shared-configs:
          - data-id: gateway-routes.yaml
            group: DEFAULT_GROUP
            refresh: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-in-production-min-32-chars}
  access-token-ttl: 7200
  refresh-token-ttl: 604800

gateway:
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:100}
    window-seconds: ${RATE_LIMIT_WINDOW:60}
    path-patterns: /api/**

logging:
  level:
    com.platform.gateway: DEBUG