# =====================================================================
#  AI Agent Platform —— Nginx 站点配置（模板）
#
#  ⚠️ 这是**模板**，不要手工拷到 /etc/nginx/。remote-install.sh 会把下面的
#     占位符替换成 deploy.conf 里的真实值，写到
#     /etc/nginx/sites-available/ai-agent.conf 并软链到 sites-enabled/,
#     同时删掉自带的 default 站点（它占着 80 的 default_server）。
#
#      __PUBLIC_PORT__   对外端口（deploy.conf: PUBLIC_PORT，默认 80）
#      __SERVER_NAME__   域名（deploy.conf: DOMAIN，留空则为 _ 通配）
#      __WEB_ROOT__      前端产物目录（deploy.conf: REMOTE_WEB）
#      __GATEWAY_PORT__  Gateway 监听端口（deploy.conf: PORT_GATEWAY）
#
#  作用: 托管前端静态文件 + 反向代理 /api 到 Gateway
#
#  部署阶段说明:
#    阶段一（域名未备案）: 用 IP + 端口访问。云厂商对未备案域名封 80/443,
#                          但**用 IP 直接访问 80 是允许的**。若你的安全组不放行
#                          80, 把 deploy.conf 的 PUBLIC_PORT 改成 8080 重跑即可。
#    阶段二（域名已备案）: 在 deploy.conf 里填 DOMAIN 并重跑 deploy.sh config,
#                          再用 certbot 签发证书（见文件末尾说明）。
#
#  ⚠️ 三个必须保留的关键点（改动会导致功能静默失效）:
#    1. /api/v1/llm/chat/stream 必须 proxy_buffering off
#       —— 否则 SSE 流式回复会被 nginx 缓冲, 前端表现为"等很久一次性吐出全部"。
#    2. /api/v1/tasks/ws 必须带 Upgrade/Connection 头
#       —— 否则 WebSocket 升级失败, 任务进度条不动。
#    3. Gateway 的 response-timeout 对 SSE 已设为 -1, nginx 侧 proxy_read_timeout
#       必须同步放宽 —— 否则长回答会在 nginx 层被掐断（504）。
# =====================================================================

upstream ai_gateway {
    server 127.0.0.1:__GATEWAY_PORT__;
    keepalive 32;
}

server {
    listen __PUBLIC_PORT__;
    server_name __SERVER_NAME__;

    # 前端构建产物（deploy 脚本会上传到这个目录）
    root __WEB_ROOT__;
    index index.html;

    # 访问日志（排障用）
    access_log /var/log/nginx/ai-agent.access.log;
    error_log  /var/log/nginx/ai-agent.error.log warn;

    # 上传大小上限（RAG 文档上传 2MB + 余量, 与 agent-core rag.upload-max-size-bytes 对应）
    client_max_body_size 20m;

    # ------------------------------------------------------------------
    #  前端静态资源
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 构建产物带内容哈希, 可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 前端 public/ 下的静态资源（头像框、聊天背景等）, 无哈希, 短缓存
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ------------------------------------------------------------------
    #  SSE 流式对话 —— 必须精确匹配, 且关闭缓冲
    #  对应 Gateway 路由 id=llm-stream (metadata.response-timeout: -1)
    # ------------------------------------------------------------------
    location = /api/v1/llm/chat/stream {
        proxy_pass http://ai_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 关键三项
        proxy_buffering off;
        proxy_cache     off;
        gzip            off;

        # 长连接: 后端 SseEmitter 300s + 心跳 15s, 这里给足余量
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        send_timeout          3600s;

        # 禁用响应缓冲（部分 nginx 版本需要显式关）
        proxy_max_temp_file_size 0;
    }

    # ------------------------------------------------------------------
    #  WebSocket 任务进度 —— 必须带 Upgrade 头
    #  对应 Gateway 路由 id=task-ws
    # ------------------------------------------------------------------
    location /api/v1/tasks/ws {
        proxy_pass http://ai_gateway;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WS 是长连接, 默认 60s 会被掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    #  其余所有 API —— 走 Gateway
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://ai_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;   # 普通接口上限, 与 Gateway httpclient.response-timeout 30s 无冲突
        proxy_send_timeout    120s;
    }

    # ------------------------------------------------------------------
    #  文件访问不需要单独代理: PublicFileController 拼的地址是
    #      {engine-base-url}/api/v1/public/files/{fileId}?token=...
    #  走的是 /api/ 这条规则, 已经覆盖。MinIO 只绑 127.0.0.1, 浏览器不直连。
    # ------------------------------------------------------------------

    # 健康检查: 供部署脚本确认 nginx 已起来
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# =====================================================================
#  阶段二: 域名备案通过后启用
#
#  步骤:
#    1. 在 deploy.conf 里填 DOMAIN="你的域名" 并重跑 ./deploy.sh config
#       （remote-install.sh 会据此重写本文件里的 __SERVER_NAME__）
#    2. 安装 certbot: apt install -y certbot python3-certbot-nginx
#    3. 签发证书:    certbot --nginx -d your-domain.com -d www.your-domain.com
#       （certbot 会自动改写本文件并加上 443 配置 + 80→443 跳转）
#    4. 重新加载:    nginx -t && systemctl reload nginx
#
#  注意: 备案通过后还要同步更新 Gateway 的 CORS 白名单（见 deploy.conf 的
#        CORS_ALLOWED_ORIGINS）, 否则浏览器会因跨域拒绝请求。
# =====================================================================
