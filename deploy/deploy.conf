#!/usr/bin/env bash
# =====================================================================
#  AI Agent Platform —— 部署总控配置
#
#  这是**唯一**需要按环境修改的文件。极简版(2C2G) 与 完整版(4C4G/4C8G)
#  的差异全部收敛到下面的开关里，升级服务器时只改这个文件然后重跑 deploy.sh。
#
#  被以下脚本 source:
#    deploy/build-local.ps1   （Windows 本地: 构建 jar + 前端产物）
#    deploy/deploy.sh         （服务器: 上传产物 + 启动服务）
#    deploy/remote-install.sh （服务器: 首次环境初始化, 由 deploy.sh 调用）
# =====================================================================

# ---------------------------------------------------------------------
#  1. 服务器连接（本地构建上传时使用）
# ---------------------------------------------------------------------
SERVER_HOST="47.104.146.250"   # 云服务器公网 IP
SERVER_USER="root"
SERVER_SSH_PORT="22"
SSH_KEY=""                     # 私钥路径, 留空则用默认 ~/.ssh/id_rsa 或密码登录

# ---------------------------------------------------------------------
#  2. 部署路径
# ---------------------------------------------------------------------
REMOTE_ROOT="/opt/ai-agent"    # 服务器上的部署根目录
REMOTE_APPS="${REMOTE_ROOT}/apps"     # jar 存放
REMOTE_WEB="${REMOTE_ROOT}/web"       # 前端静态产物
REMOTE_CONFIG="${REMOTE_ROOT}/config" # 运行时配置覆盖
REMOTE_LOGS="${REMOTE_ROOT}/logs"     # 应用日志

# ---------------------------------------------------------------------
#  3. 对外访问
# ---------------------------------------------------------------------
# 【为什么是 8080 而不是 80】
# 国内云服务器（阿里云/腾讯云等）对**未备案**的实例，会在云厂商或运营商层
# 直接丢弃 80/443 的入站包。表现是：安全组明明放行了，从外部测仍是
# connect timeout —— 和"安全组没生效"完全无法区分，极易误判。
# 换成非标准端口（8080）不受此限制，立刻可用。
#
# 访问地址会变成 http://47.104.146.250:8080
# 备案通过后：把这里改回 80（或配合 DOMAIN 用 443），重跑 ./deploy.sh all。
#             CORS / 参考图回拉地址都会自动跟着变，不用手改。
PUBLIC_PORT="8080"
# 域名未备案阶段: 留空, 用 http://<服务器IP>:<PUBLIC_PORT> 访问。
# 备案通过后: 填真实域名（不带 http://）, 并重跑 deploy.sh。
DOMAIN=""

# Gateway CORS 白名单。
# ⚠️ 这一项**无需在此配置**：deploy.sh 会按 SERVER_HOST / DOMAIN / PUBLIC_PORT
#    自动推导出正确的来源，写进服务器上的 services.env（见 deploy.sh 的
#    gen_services_env → public_base）。这里留个说明，避免有人以为改了这里
#    就能生效。
#    确实需要额外来源（比如同时用 IP 和域名访问）时，部署后在服务器上
#    直接改 /opt/ai-agent/services.env 的 CORS_ALLOWED_ORIGINS 再 restart。
CORS_ALLOWED_ORIGINS="http://localhost:3000"   # 占位，会被自动推导覆盖

# ---------------------------------------------------------------------
#  4. 部署档位 —— 改这里切换极简版/完整版
#
#  档位            适用机器    组成
#  ─────────────────────────────────────────────────────────────────
#  lite   (极简)   2核2G      5 个服务, 无 Nacos, 静态服务发现
#  medium (中等)   4核4G      7 个服务, 无 Nacos, 静态服务发现
#  full   (完整)   4核8G      7 个服务 + Nacos, 原架构不变
#
#  ⚠️ 改档位后需要重新上传 config 并重启全部服务: ./deploy.sh all
# ---------------------------------------------------------------------
PROFILE="lite"

# ---------------------------------------------------------------------
#  5. 服务开关（一般不用手改, 由 PROFILE 推导; 需要微调时可直接覆盖）
#
#  内存基线（实测常驻, 未调优 / 调优后）:
#    gateway         161 MB / 150 MB   —— 必须
#    user-service    214 MB / 180 MB   —— 必须（登录鉴权）
#    agent-core      311 MB / 280 MB   —— 必须（任务编排 + 对话 + RAG）
#    image-engine    306 MB / 180 MB   —— 图片生成, 极简版保留
#    storage-service 260 MB / 170 MB   —— 文件存储, 极简版保留
#    security-service293 MB / 180 MB   —— 审计与水印, 极简版关闭
#    video-engine    290 MB / 180 MB   —— 视频生成, 极简版关闭
# ---------------------------------------------------------------------
case "${PROFILE}" in
  lite)
    ENABLE_NACOS="false"        # 静态服务发现替代, 省 ~500 MB（调优后）
    ENABLE_VIDEO_ENGINE="false"
    ENABLE_SECURITY_SERVICE="false"
    ENABLE_IMAGE_ENGINE="true"
    ENABLE_STORAGE_SERVICE="true"
    ENABLE_MINIO="true"
    ENABLE_RABBITMQ="true"      # image-engine 消费任务队列, 必须有
    ;;
  medium)
    ENABLE_NACOS="false"
    ENABLE_VIDEO_ENGINE="true"
    ENABLE_SECURITY_SERVICE="true"
    ENABLE_IMAGE_ENGINE="true"
    ENABLE_STORAGE_SERVICE="true"
    ENABLE_MINIO="true"
    ENABLE_RABBITMQ="true"
    ;;
  full)
    ENABLE_NACOS="true"
    ENABLE_VIDEO_ENGINE="true"
    ENABLE_SECURITY_SERVICE="true"
    ENABLE_IMAGE_ENGINE="true"
    ENABLE_STORAGE_SERVICE="true"
    ENABLE_MINIO="true"
    ENABLE_RABBITMQ="true"
    ;;
  *)
    echo "错误: PROFILE 只能是 lite / medium / full, 当前为 '${PROFILE}'" >&2
    return 1 2>/dev/null || exit 1
    ;;
esac

# ---------------------------------------------------------------------
#  6. JVM 参数 —— 2C2G 必须显式限制, 否则 JVM 按物理内存自动扩张会 OOM
#
#  格式: 服务名="-Xmx<堆上限> <其他>"
#
#  【基础参数】
#  -Xss512k          : 线程栈调小（Spring Boot 线程多, 默认 1M 在 2G 机器上是浪费）
#  -XX:+UseSerialGC  : 2 核机器上 SerialGC 比 G1 更省内存（G1 需额外维护记忆集和
#                      并发标记线程, 小堆上收益为负）
#  -XX:MaxMetaspaceSize : 防止 Metaspace 无上限增长
#
#  【2C2G 专用防御参数 —— 这几条是小内存机器的保命项】
#  -XX:+ExitOnOutOfMemoryError
#      堆耗尽时立刻退出, 由 systemd 按 Restart=on-failure 拉起。
#      不加的话 JVM 会疯狂 GC + 换页, swap 打满、SSH 卡死, 整机假死;
#      加了这个最坏只是"该服务重启一次"。
#  -XX:ActiveProcessorCount=2
#      JVM 默认按宿主机 CPU 数算线程池大小。容器/云主机上可能读到 8 或 16,
#      导致 ForkJoinPool、GC 线程数按 16 核开, 白白吃掉内存和上下文切换。
#  -XX:-UsePerfData
#      关掉 hsperfdata 文件写入, 每个 JVM 省 几 MB（2C2G 上 5 个 JVM 就是几十 MB）。
#  -XX:MaxDirectMemorySize
#      Netty(网关)、OkHttp(引擎) 用堆外内存, 默认上限 = Xmx, 不限制会突破物理内存。
#
#  【编码】-Dfile.encoding=UTF-8
#      Linux 默认 locale 可能是 POSIX/C, 不加会按 ASCII 处理导致中文乱码
#      （与 sql 脚本 SET NAMES utf8mb4 是同一类问题的两个面）。
# ---------------------------------------------------------------------
JVM_BASE="-Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -XX:ActiveProcessorCount=2 -XX:-UsePerfData -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom"

JVM_SMALL="${JVM_BASE} -XX:MaxMetaspaceSize=128m"
JVM_MEDIUM="${JVM_BASE} -XX:MaxMetaspaceSize=160m"

# 堆分配依据（lite 档实测常驻）:
#   gateway    150MB / 堆128m / 堆外需给 Netty 留 ~64m
#   user       180MB / 堆192m
#   agent-core 280MB / 堆320m（对话+RAG+编排, 类最多所以 Metaspace 给 160m）
#   image      180MB / 堆192m
#   storage    170MB / 堆160m
JVM_OPTS_gateway="${JVM_SMALL}  -Xmx128m -XX:MaxDirectMemorySize=96m"
JVM_OPTS_user_service="${JVM_SMALL}  -Xmx192m"
JVM_OPTS_agent_core="${JVM_MEDIUM} -Xmx320m"
JVM_OPTS_image_engine="${JVM_SMALL}  -Xmx192m"
JVM_OPTS_storage_service="${JVM_SMALL}  -Xmx160m"
JVM_OPTS_security_service="${JVM_SMALL}  -Xmx192m"
JVM_OPTS_video_engine="${JVM_SMALL}  -Xmx192m"

# ---------------------------------------------------------------------
#  7. 端口（改动需同步 nginx 配置和 deploy/services.env）
#
#  ⚠️ PORT_GATEWAY 必须与 PUBLIC_PORT 不同！
#     两者相同会造成死循环：nginx 监听 PUBLIC_PORT，又要把 /api 反代到
#     127.0.0.1:PORT_GATEWAY —— 若二者相等，nginx 就把请求打给了自己，
#     每跳一次请求头累积一层，最终浏览器得到
#       400 Request Header Or Cookie Too Large
#     这个现象看起来像"nginx 配置错"，实际是端口自环，很难反查。
#     所以 gateway 用内部端口 8090，对外仍由 nginx 的 8080 承接。
# ---------------------------------------------------------------------
PORT_GATEWAY=8090               # 内部端口，仅 127.0.0.1 可达（nginx 反代目标）
PORT_USER_SERVICE=8081
PORT_AGENT_CORE=8082
PORT_SECURITY_SERVICE=8083
PORT_STORAGE_SERVICE=8084
PORT_IMAGE_ENGINE=8085
PORT_VIDEO_ENGINE=8086

PORT_MYSQL=3306        # 生产用标准端口（开发环境是 3307 避让本机实例）
PORT_REDIS=6379
PORT_RABBITMQ=5672
PORT_MINIO=9000
PORT_MINIO_CONSOLE=9001
PORT_NACOS=8848

# ---------------------------------------------------------------------
#  8. 数据库
# ---------------------------------------------------------------------
DB_NAME="agent_platform"
DB_USER="root"
DB_PASSWORD=""         # 留空则由 remote-install.sh 首次部署时随机生成并写入服务器 .env
                       # 重复部署会复用已有值, 不会重置（改它会让存量数据读不出来）

# ---------------------------------------------------------------------
#  9. 镜像与体积控制
# ---------------------------------------------------------------------
MAVEN_IMAGE="maven:3.9-eclipse-temurin-17"   # 仅 CI/容器内构建用, 本地构建不需要
NODE_IMAGE="node:20-alpine"

# 是否在服务器上构建（false = 本地构建后上传, 2C2G 强烈建议 false）
# 2C2G 上跑 Maven 编译需要 1.5G+ 内存, 会和运行中的服务抢内存导致 OOM。
BUILD_ON_SERVER="false"
