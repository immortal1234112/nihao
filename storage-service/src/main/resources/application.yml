spring:
  application:
    name: storage-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/storage_service?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 8084

internal:
  # 服务间内部接口鉴权令牌：/api/v1/internal/** 校验 X-Internal-Token（start.ps1 自动生成）
  # 未配置时不启用校验（本地模式），生产环境必须通过 INTERNAL_AUTH_TOKEN 配置
  auth-token: ${INTERNAL_AUTH_TOKEN:}

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:agent-platform}

# 网关地址：拼装对外可访问的文件下载 URL（客户端经网关下载，鉴权由网关 JWT 完成）
storage:
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}

logging:
  level:
    com.platform.storagesvc: DEBUG
